name: Polish verification
# Validate glass settings, gallery background, sharing and navigation integration.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/polish
    paths:
      - .github/workflows/polish-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install JDK 25 toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Run Gradle with JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Validate localized resources
        run: |
          python3 scripts/check_compose_resource_escapes.py
          python3 scripts/test_compose_resource_escapes.py
          python3 scripts/check_translation_mechanics.py
          python3 scripts/test_translation_mechanics.py
      # Separate Gradle invocations avoid compiling desktop/iOS and Android concurrently on a small runner.
      # Recheck light theme glass surfaces and level-specific streak flames.
      - name: Run full shared Android host tests
        run: ./gradlew :shared:testAndroidHostTest --no-daemon --max-workers=2 -Dorg.gradle.parallel=false -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"
      - name: Run full Android app unit tests
        if: success() || failure()
        run: ./gradlew :androidApp:testDebugUnitTest --no-daemon --max-workers=2 -Dorg.gradle.parallel=false -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"
      - name: Run Android lint
        if: success() || failure()
        run: ./gradlew :androidApp:lintDebug --no-daemon --max-workers=2 -Dorg.gradle.parallel=false -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"
      - name: Check Android and shared Kotlin formatting
        if: success() || failure()
        run: |
          curl -fsSL https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint -o "$RUNNER_TEMP/ktlint"
          echo 'a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75  '"$RUNNER_TEMP/ktlint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" 'androidApp/src/**/*.kt' 'shared/src/**/*.kt' 'androidApp/**/*.kts' 'shared/**/*.kts'
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: polish-verification-reports
          path: |
            androidApp/build/reports/lint*
            androidApp/build/reports/tests/
            androidApp/build/reports/ktlint/
            shared/build/reports/tests/
          if-no-files-found: ignore
