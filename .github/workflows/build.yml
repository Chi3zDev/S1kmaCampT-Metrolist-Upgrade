name: Fork debug APK

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      # The Android and shared modules require Temurin 25 as their compilation toolchain.
      - name: Install JDK 25 toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Run Gradle with JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"

      - name: Upload visual-test debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-visual-test-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error

      - name: Test streak recovery and glass geometry
        run: ./gradlew :androidApp:testDebugUnitTest --tests com.metrolist.android.ui.glass.GlassBackdropVisibilityTest --tests com.metrolist.android.streak.ListeningStreakTest --tests com.metrolist.android.recap.RecapDataTest --tests com.metrolist.android.recap.RecapMotionPolicyTest --tests com.metrolist.android.ui.screens.HomeMotionPolicyTest --tests com.metrolist.android.ui.GlassMorphGeometryTest --tests com.metrolist.android.ui.player.SystemMusicVolumeControlTest --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"

      - name: Test upgrade defaults and poster compatibility
        run: ./gradlew :shared:testAndroidHostTest --tests com.metrolist.shared.api.ExperimentalVideoResultTest --tests com.metrolist.shared.settings.ForkFontDefaultsTest --tests com.metrolist.shared.ui.screens.AboutUpgradeNotesTest --tests com.metrolist.shared.ui.components.lyrics.GlassLyricsPosterTest --tests com.metrolist.shared.ui.components.lyrics.LyricGlowTest --tests com.metrolist.shared.ui.components.lyrics.words.SyllableGlowTest --tests com.metrolist.shared.ui.player.PlayerSliderEffectsTest --tests com.metrolist.shared.ui.player.VinylRecordTest --tests com.metrolist.shared.ui.player.PlayerArtworkTransitionSettingTest --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"

      - name: Assemble optimized benchmark APK
        run: ./gradlew :androidApp:assembleBenchmark --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"

      - name: Prepare universal APK
        run: |
          test -f androidApp/build/outputs/apk/debug/androidApp-debug.apk
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk Metrolist-fork-debug-universal.apk
          test -f androidApp/build/outputs/apk/benchmark/androidApp-benchmark.apk
          cp androidApp/build/outputs/apk/benchmark/androidApp-benchmark.apk Metrolist-fork-release-test-universal.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-fork-debug-universal
          path: |
            Metrolist-fork-debug-universal.apk
            Metrolist-fork-release-test-universal.apk
          if-no-files-found: error

      - name: Publish latest-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --title latest-build --prerelease --latest=false
          else
            gh release create latest-build --title latest-build --target "$GITHUB_SHA" --prerelease --latest=false --notes 'Latest successful fork debug build.'
          fi
          gh release upload latest-build Metrolist-fork-debug-universal.apk Metrolist-fork-release-test-universal.apk --clobber

  signed_release:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Chi3zDev/S1kmaCampT-Metrolist-Upgrade' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/permanent-release' || github.ref == 'refs/heads/feature/polish')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install JDK 25 toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Run Gradle with JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Test streak recovery and glass geometry
        run: ./gradlew :androidApp:testDebugUnitTest --tests com.metrolist.android.streak.ListeningStreakTest --tests com.metrolist.android.recap.RecapDataTest --tests com.metrolist.android.recap.RecapMotionPolicyTest --tests com.metrolist.android.ui.screens.HomeMotionPolicyTest --tests com.metrolist.android.ui.GlassMorphGeometryTest --tests com.metrolist.android.ui.player.SystemMusicVolumeControlTest --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"

      - name: Test upgrade defaults and poster compatibility
        run: ./gradlew :shared:testAndroidHostTest --tests com.metrolist.shared.settings.ForkFontDefaultsTest --tests com.metrolist.shared.ui.screens.AboutUpgradeNotesTest --tests com.metrolist.shared.ui.components.lyrics.GlassLyricsPosterTest --tests com.metrolist.shared.ui.components.lyrics.LyricGlowTest --tests com.metrolist.shared.ui.components.lyrics.words.SyllableGlowTest --tests com.metrolist.shared.ui.player.PlayerSliderEffectsTest --tests com.metrolist.shared.ui.player.VinylRecordTest --tests com.metrolist.shared.ui.player.PlayerArtworkTransitionSettingTest --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"

      - name: Build and verify signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export KEYSTORE_PATH="$RUNNER_TEMP/metrolist-release.p12"
          trap 'rm -f "$KEYSTORE_PATH" "$RUNNER_TEMP/release-cert.der"' EXIT
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          ./gradlew :androidApp:assembleRelease --no-daemon --no-configuration-cache -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          echo "Checking APK output path"
          test -f "$apk" || { echo "ERROR: APK not found at expected path"; find androidApp/build/outputs/apk/release -type f; exit 1; }
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Checking APK signature"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          echo "Reading signing certificate"
          keytool -exportcert -keystore "$KEYSTORE_PATH" -storetype PKCS12 -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD -file "$RUNNER_TEMP/release-cert.der" >/dev/null 2>&1
          expected=$(sha256sum "$RUNNER_TEMP/release-cert.der" | cut -d' ' -f1)
          echo "Comparing certificate fingerprints"
          awk -v expected="$expected" '
            /^(Signer #1|V[123](\.[0-9]+)? Signer): certificate SHA-256 digest: / {
              seen++
              if ($NF != expected) mismatch = 1
            }
            END { if (seen == 0 || mismatch) exit 1 }
          ' "$RUNNER_TEMP/apk-signature.txt" || { echo "ERROR: certificate fingerprint mismatch or unavailable"; exit 1; }
          echo "Checking application ID"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.chi3zdev.metrolist'" "$RUNNER_TEMP/apk-badging.txt"
          cp "$apk" Metrolist-fork-release-universal.apk
          sha256sum Metrolist-fork-release-universal.apk > Metrolist-fork-release-universal.apk.sha256
          echo 'Signature and application ID verified.'

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-fork-signed-release
          path: |
            Metrolist-fork-release-universal.apk
            Metrolist-fork-release-universal.apk.sha256
          if-no-files-found: error
