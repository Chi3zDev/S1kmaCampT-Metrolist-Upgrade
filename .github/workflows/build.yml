name: Fork debug APK

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      # The Android and shared modules require Temurin 25 as their compilation toolchain.
      - name: Install JDK 25 toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Run Gradle with JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"

      - name: Test streak recovery and glass geometry
        run: ./gradlew :androidApp:testDebugUnitTest --tests com.metrolist.android.streak.ListeningStreakTest --tests com.metrolist.android.ui.GlassMorphGeometryTest --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"

      - name: Assemble optimized benchmark APK
        run: ./gradlew :androidApp:assembleBenchmark --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64"

      - name: Prepare universal APK
        run: |
          test -f androidApp/build/outputs/apk/debug/androidApp-debug.apk
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk Metrolist-fork-debug-universal.apk
          test -f androidApp/build/outputs/apk/benchmark/androidApp-benchmark.apk
          cp androidApp/build/outputs/apk/benchmark/androidApp-benchmark.apk Metrolist-fork-release-test-universal.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-fork-debug-universal
          path: |
            Metrolist-fork-debug-universal.apk
            Metrolist-fork-release-test-universal.apk
          if-no-files-found: error

      - name: Publish latest-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --title latest-build --target "$GITHUB_SHA"
          else
            gh release create latest-build --title latest-build --target "$GITHUB_SHA" --notes 'Latest successful fork debug build.'
          fi
          gh release upload latest-build Metrolist-fork-debug-universal.apk Metrolist-fork-release-test-universal.apk --clobber
